name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Lint
        run: ruff check .
      - name: API and local tests
        run: python -m pytest -m "api or smoke" --html=html-report/report.html --self-contained-html
      - name: UI smoke tests
        run: python -m pytest -m "ui and smoke" --browser chromium --tracing=retain-on-failure
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            html-report/
            test-results/

